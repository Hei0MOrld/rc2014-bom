name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      # Also type-checks (LayoutProps etc. are generated during the build).
      # No API keys in CI: the supplier clients fall back to MOCK parts.
      - run: npm run build
